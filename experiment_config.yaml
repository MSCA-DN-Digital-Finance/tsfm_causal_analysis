####################################
# Case Study Experiments
####################################

  # -----------------------
  # Experiment 11: Unisolar
  # -----------------------
  - id: 11
    name: "Unisolar"
    generator:
      type: "unisolar"
      params: {} # placeholder dummy as there are no other parameters
      sweep:
        slice_length: [ # one 24-hour cycle is 96 15-minute time steps 
          96, 192, 288, 384, 480,
          576, 672, 768, 864, 960
          ]
    prediction:
      input_length: 800 # will be ignored by the unisolar generator, but still needs to be set to a value
      output_length: 200
    analysis:
      param_estimate: "estimated_wavelength"

  # -----------------------
  # Experiment 12: SWAT
  # -----------------------
  - id: 12
    name: "SWAT"
    generator:
      type: "swat"
      params: {} # placeholder dummy as there are no other parameters
      sweep:
        slice_length: [ 
          300, 350, 400, 450, 500,
          550, 600, 650, 700, 750
          ]
    prediction:
      input_length: 800 # will be ignored by the swat generator, but still needs to be set to a value
      output_length: 250 # max output length for TimesFM-2.5 is 256
    analysis:
      param_estimate: "estimated_dwell_time"



